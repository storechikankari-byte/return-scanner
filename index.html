<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Return Scanner</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Return Scanner">
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--muted:#67635c;--line:#dedbd4;--accent:#1f4f8a;--on:#fff;--good:#1c7a46;--bad:#b3261e;--warn:#8a5a00;--warnbg:#fdf3dc;--badbg:#fbe9e7;--goodbg:#e6f4ec;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--card:#22211e;--ink:#f1efea;--muted:#a8a39a;--line:#3a3833;--accent:#7fb0ea;--on:#0d1b2a;--good:#62c48d;--bad:#f0837a;--warn:#e7b95a;--warnbg:#332a14;--badbg:#3a1f1c;--goodbg:#17301f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font-size:20px;margin:0 0 12px}
h2{font-size:15px;margin:22px 0 8px;color:var(--muted);font-weight:600}
p{margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.muted{color:var(--muted);font-size:14px}
.mono{font-family:ui-monospace,Consolas,Menlo,monospace;overflow-wrap:anywhere}
.big{font-size:21px;font-weight:600}
button{font:inherit;font-weight:600;min-height:48px;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on)}
button.good{background:var(--good);border-color:var(--good);color:#fff}
button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
@media (prefers-color-scheme:dark){button.good,button.bad{color:#10100f}}
button.wide{width:100%}
button.tall{min-height:68px;font-size:19px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
input,select{font:inherit;width:100%;min-height:48px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.note{padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:15px}
.note.warn{background:var(--warnbg);color:var(--warn)}
.note.bad{background:var(--badbg);color:var(--bad)}
.note.good{background:var(--goodbg);color:var(--good)}
.q{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.q:first-child{border-top:0}
.cam{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;z-index:5}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cam .top,.cam .bottom{position:relative;z-index:2;padding:12px 16px;background:rgba(0,0,0,.62)}
.cam .top{padding-top:calc(12px + env(safe-area-inset-top))}
.cam .bottom{margin-top:auto;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.cam button{border-color:rgba(255,255,255,.4)}
.cam button:not(.good):not(.bad){background:rgba(255,255,255,.14);color:#fff}
.cam button.good{background:#1c7a46;border-color:#1c7a46;color:#fff}.cam button.bad{background:#b3261e;border-color:#b3261e;color:#fff}
.guide{position:absolute;z-index:1;left:5%;right:5%;top:25%;bottom:25%;border:3px solid #fff;border-radius:10px;box-shadow:0 0 0 2000px rgba(0,0,0,.28)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#ff4b3e;margin-right:7px;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));max-width:528px;margin:auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:8px;z-index:9}
</style>
</head>
<body>
<main id="app"><p class="muted">Loading...</p></main>
<script src="config.js"></script>
<script src="vendor/msal-browser.min.js"></script>
<script src="vendor/zxing-reader.js"></script>
<script src="app.js"></script>
</body>
</html>
